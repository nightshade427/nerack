<div id="todo_{{id}}">
  {{^finished}}
    <input type="checkbox" data-on:click__prevent="@patch('{{url:http_todo:finished=1}}')">
  {{/finished}}
  {{#finished}}
    <input type="checkbox" checked data-on:click__prevent="@patch('{{url:http_todo}}')">
  {{/finished}}
  {{title}}
  <button data-on:click="@delete('{{url:http_todo}}')">delete</button>
</div>
